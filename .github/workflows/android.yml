# Streamly Sim: builds the Android app from the game in play/.
# Runs on every push that changes play/ or app/, or by hand from the Actions tab.
# Output (Actions > the run > Artifacts):
#   streamly-sim-test-apk     install on your phone to test (always built)
#   streamly-sim-play-upload  the .aab for Google Play (only once the signing secrets are added)

name: Android app

on:
  push:
    branches: [main]
    paths: ['play/**', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install build tools
        run: npm install --no-audit --no-fund

      - name: Copy the game into the app
        run: node build.mjs web

      - name: Create the Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#1d4ed8' --splashBackgroundColor '#0a0a0a' --splashBackgroundColorDark '#0a0a0a'
          node build.mjs android
          npx cap sync android

      - name: Unpack the signing key
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the test APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build the signed Play bundle and APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Name the files
        run: |
          mkdir -p out
          V=$(node -p "require('./streamly.config.json').versionName")
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/streamly-sim-$V-build$VERSION_CODE-test.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/streamly-sim-$V-build$VERSION_CODE.aab"
            cp android/app/build/outputs/apk/release/app-release.apk "out/streamly-sim-$V-build$VERSION_CODE.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: streamly-sim-test-apk
          path: app/out/*-test.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: streamly-sim-play-upload
          path: |
            app/out/*.aab
            app/out/*build*[0-9].apk
